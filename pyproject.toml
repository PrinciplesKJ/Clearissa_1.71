[project]
name = "clearissa"
version = "1.23"
description = "Professional data analysis platform for multi-channel fluorescence spectroscopy"
authors = [
    { name = "Križan Jurinović", email = "k.jurinovic22@ic.ac.uk" }
]
readme = "readme.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
keywords = ["fluorescence", "spectroscopy", "data-analysis", "kinetics", "FRET"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.1,<3.0.0",
    "scipy>=1.11.4,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "PyQt5>=5.15.0",
    "PyQtGraph>=0.13.0",
    "openpyxl>=3.0.0",
    "tabulate>=0.9.0",
    "sympy>=1.12",
    "plotnine>=0.10.1",
    "mizani>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.13.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/clearissa"
Documentation = "https://github.com/yourusername/clearissa/wiki"
Repository = "https://github.com/yourusername/clearissa"
Issues = "https://github.com/yourusername/clearissa/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "ui"]
